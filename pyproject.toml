[project]
name = "voice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "espeakng-loader>=0.2.4",
    "huggingface-hub>=1.24.0",
    "num2words>=0.5.14",
    "numpy>=1.26,<3",
    "onnxruntime>=1.18,<2",
    "phonemizer>=3.3",
    "scipy",
    "soundfile>=0.13",
    "torch",
    "unidecode>=1.3.8",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
