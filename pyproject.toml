[project]
name = "inflect-speechd"
version = "0.1.0"
description = "Local Inflect TTS server with Speech Dispatcher integration."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "espeakng-loader>=0.2.4",
    "huggingface-hub",
    "num2words>=0.5.14",
    "numpy>=1.26,<3",
    "onnx",
    "onnxruntime>=1.18,<2",
    "phonemizer>=3.3",
    "scipy",
    "soundfile>=0.13",
    "torch",
    "unidecode>=1.3.8",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
norecursedirs = ["resources"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.5",
    "ty>=0.0.63",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
